services:
  # 1. Base de Datos PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: inventory_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: receipt_inventory
    volumes:
      # Monta el script SQL de inicialización
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      # *** VOLUMEN DE PERSISTENCIA AÑADIDO ***
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d receipt_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Servicio de la API Core (Python FastAPI)
  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: core_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # URL de conexión a la DB explícita con driver psycopg2
      DATABASE_URL: postgresql+psycopg2://user:password@postgres:5432/receipt_inventory
    volumes:
      # Montamos la carpeta de secretos desde la máquina local al contenedor.
      - ./backend/secrets:/app/backend/secrets:ro
    # Recarga automática en desarrollo
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

# *** DEFINICIÓN DEL VOLUMEN PERSISTENTE ***
volumes:
  db_data:
